<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>ZapaStore | Productos</title>

    <!-- ✅ Bootstrap y fuentes -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #f8f9fa, #eef1f5);
            color: #333;
        }

        /* 🔹 Navbar */
        .navbar {
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            font-weight: 500;
        }

        .navbar-brand {
            font-weight: 700;
            font-size: 1.4rem;
        }

        /* 🔹 Sección productos */
        h2 {
            font-weight: 700;
            text-transform: uppercase;
            color: #212529;
            margin-bottom: 2rem;
        }

        .card {
            border: none;
            border-radius: 15px;
            overflow: hidden;
            transition: all 0.3s ease;
            background-color: #fff;
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        .card img {
            height: 260px;
            object-fit: cover;
            transition: transform 0.4s ease;
        }

        .card:hover img {
            transform: scale(1.05);
        }

        .card-title {
            font-weight: 600;
            color: #212529;
        }

        .card-text {
            font-size: 0.95rem;
            color: #6c757d;
            min-height: 50px;
        }

        .card .fw-bold {
            color: #0d6efd;
        }

        .btn-dark {
            border-radius: 10px;
            transition: all 0.3s ease;
        }

        .btn-dark:hover {
            background-color: #0b5ed7;
        }

        /* 🔹 Carrito lateral */
        #sidebar-carrito {
            position: fixed;
            right: -400px;
            top: 0;
            width: 400px;
            height: 100%;
            background: #fff;
            box-shadow: -4px 0 15px rgba(0,0,0,0.1);
            transition: right 0.3s ease;
            z-index: 1050;
            padding: 25px;
            overflow-y: auto;
        }

        #sidebar-carrito.open {
            right: 0;
        }

        #overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1040;
        }

        #overlay.active {
            display: block;
        }

        #footer-carrito p {
            font-size: 1.1rem;
        }

        /* 🔹 Responsive */
        @media (max-width: 768px) {
            #sidebar-carrito {
                width: 100%;
            }

            .card img {
                height: 200px;
            }
        }

        /* ✨ Animación suave */
        .fade-in {
            animation: fadeIn 0.7s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

<body>
<!-- 🧭 NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
    <div class="container">
        <a class="navbar-brand" href="/">👟 ZapaStore</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">

                <li class="nav-item">
                    <a class="nav-link" th:href="@{/}">Inicio</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" th:href="@{/productos}">Productos</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" th:href="@{/contacto}">Contacto</a>
                </li>

                <!-- 🔥 SOLO SE MUESTRA SI HAY SESIÓN -->
                <li class="nav-item" th:if="${session.usuario != null}">
                    <a class="nav-link" th:href="@{/perfil}">Mi Perfil</a>
                </li>

                <li class="nav-item" th:if="${session.usuario != null}">
                    <a class="nav-link text-danger" th:href="@{/logout}">Cerrar Sesión</a>
                </li>

                <!-- 🔥 SI NO HAY SESIÓN: mostrar INICIAR SESIÓN -->
                <li class="nav-item" th:if="${session.usuario == null}">
                    <a class="nav-link" th:href="@{/login}">Iniciar Sesión</a>
                </li>

            </ul>


            <button class="btn btn-outline-light position-relative" id="btn-carrito">
                <i class="bi bi-cart-fill"></i>
                <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" id="contador-carrito">0</span>
            </button>
        </div>
    </div>
</nav>

<!-- 🛍️ PRODUCTOS -->
<div class="container mt-5 fade-in">
    <h2 class="text-center mb-4">Nuestros Productos</h2>

    <div id="cards" class="row g-4">
        <div th:each="producto : ${productos}" class="col-md-4 col-sm-6">
            <div class="card h-100 shadow-sm">
                <!-- ✅ Mostrar imagen desde URL -->
                <img th:src="${producto.imagen}" class="card-img-top" alt="Imagen del producto">

                <div class="card-body d-flex flex-column">
                    <h5 class="card-title" th:text="${producto.nombre}">Nombre del producto</h5>
                    <p class="card-text" th:text="${producto.descripcion}">Descripción breve del producto.</p>
                    <p class="fw-bold mb-3">Precio: $<span th:text="${producto.precio}">0.00</span></p>

                    <button class="btn btn-dark mt-auto"
                            th:attr="data-id=${producto.id}, data-nombre=${producto.nombre}, data-precio=${producto.precio}">
                        <i class="bi bi-bag-plus-fill me-2"></i>Agregar al carrito
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 🧾 SIDEBAR CARRITO -->
<div id="sidebar-carrito">
    <h4 class="mb-4"><i class="bi bi-cart-check me-2"></i>Tu carrito</h4>
    <ul id="lista-carrito" class="list-group mb-3"></ul>

    <div id="footer-carrito" class="border-top pt-3">
        <p><strong>Total:</strong> $<span id="total">0</span></p>
        <button id="btn-pagar" class="btn btn-success w-100 mb-2" disabled>Pagar ahora 💳</button>
        <button id="vaciar-carrito" class="btn btn-outline-danger w-100">Vaciar carrito</button>
    </div>
</div>

<div id="overlay"></div>

<!-- ✅ Script del carrito (igual que antes) -->
<script>
    const carrito = JSON.parse(localStorage.getItem('carrito')) || {};
    const listaCarrito = document.getElementById('lista-carrito');
    const totalElement = document.getElementById('total');
    const contador = document.getElementById('contador-carrito');
    const btnPagar = document.getElementById('btn-pagar');
    const btnVaciar = document.getElementById('vaciar-carrito');
    const sidebar = document.getElementById('sidebar-carrito');
    const overlay = document.getElementById('overlay');
    const btnCarrito = document.getElementById('btn-carrito');

    function actualizarCarrito() {
        listaCarrito.innerHTML = '';
        let total = 0;
        let cantidadTotal = 0;

        if (Object.keys(carrito).length === 0) {
            listaCarrito.innerHTML = '<p class="text-center text-muted mt-3">Carrito vacío 🛒</p>';
            totalElement.textContent = '0';
            contador.textContent = '0';
            btnPagar.disabled = true;
            return;
        }

        Object.values(carrito).forEach(p => {
            total += p.precio * p.cantidad;
            cantidadTotal += p.cantidad;

            const li = document.createElement('li');
            li.className = 'list-group-item d-flex justify-content-between align-items-center';
            li.innerHTML = `
              <div>
                <strong>${p.nombre}</strong> (x${p.cantidad})
                <br><small>$${p.precio.toFixed(2)} c/u</small>
              </div>
              <div>
                <button class="btn btn-sm btn-outline-info" onclick="cambiarCantidad(${p.id}, 1)">+</button>
                <button class="btn btn-sm btn-outline-danger" onclick="cambiarCantidad(${p.id}, -1)">-</button>
              </div>
            `;
            listaCarrito.appendChild(li);
        });

        totalElement.textContent = total.toFixed(2);
        contador.textContent = cantidadTotal;
        btnPagar.disabled = false;

        localStorage.setItem('carrito', JSON.stringify(carrito));
    }

    function cambiarCantidad(id, delta) {
        if (!carrito[id]) return;
        carrito[id].cantidad += delta;
        if (carrito[id].cantidad <= 0) delete carrito[id];
        actualizarCarrito();
    }

    document.addEventListener('click', e => {
        if (e.target.classList.contains('btn-dark')) {
            const btn = e.target;
            const id = btn.dataset.id;
            const nombre = btn.dataset.nombre;
            const precio = parseFloat(btn.dataset.precio);

            if (!carrito[id]) carrito[id] = { id, nombre, precio, cantidad: 0 };
            carrito[id].cantidad++;
            actualizarCarrito();
        }
    });

    btnVaciar.addEventListener('click', () => {
        Object.keys(carrito).forEach(k => delete carrito[k]);
        actualizarCarrito();
    });

btnPagar.addEventListener('click', () => {
    if (Object.keys(carrito).length === 0) {
        alert("Tu carrito está vacío 🛒");
        return;
    }

    fetch('/checkout/data', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(carrito)
    }).then(() => {

        // 🟩 VACÍA EL CARRITO REAL DEL FRONTEND
        localStorage.removeItem('carrito');

        // 🟩 REDIRIGE AL CHECKOUT
        window.location.href = '/checkout';
    });
});



    btnCarrito.addEventListener('click', () => {
        sidebar.classList.toggle('open');
        overlay.classList.toggle('active');
    });

    overlay.addEventListener('click', () => {
        sidebar.classList.remove('open');
        overlay.classList.remove('active');
    });

    actualizarCarrito();
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
