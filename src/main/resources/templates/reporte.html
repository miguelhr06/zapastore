<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Reporte de Venta</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container mt-5">
    <h2 class="text-center mb-4">🧾 Reporte de Venta</h2>

    <div class="card p-4 shadow-sm">
        <h4>Datos del cliente:</h4>
        <p><strong>Nombre:</strong> <span th:text="${venta.nombreCliente}"></span></p>
        <p><strong>Correo:</strong> <span th:text="${venta.correo}"></span></p>
        <p><strong>Dirección:</strong> <span th:text="${venta.direccion}"></span></p>
        <p><strong>Método de pago:</strong> <span th:text="${venta.metodoPago}"></span></p>

        <h4 class="mt-4">Detalles de productos:</h4>
        <table class="table table-bordered">
            <thead class="table-secondary">
            <tr>
                <th>Producto</th>
                <th>Cantidad</th>
                <th>Precio Unitario ($)</th>
                <th>Subtotal ($)</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="detalle : ${detalles}">
                <td th:text="${detalle.nombreProducto}"></td>
                <td th:text="${detalle.cantidad}"></td>
                <td th:text="${detalle.precioUnitario}"></td>
                <td th:text="${detalle.subtotal}"></td>
            </tr>
            </tbody>
        </table>

        <h5 class="text-end">
            <strong>Total:</strong>
            <span th:text="${#numbers.formatDecimal(venta.total, 1, 'COMMA', 2, 'POINT')} + ' $'"></span>
        </h5>

        <!-- ✅ Un solo botón -->
        <form th:action="@{/carrito/finalizarReporte}" method="post" class="text-center mt-4">
            <input type="hidden" name="idVenta" th:value="${venta.id}" />
            <button type="submit" class="btn btn-primary">Volver al menú principal</button>
        </form>
    </div>
</div>
</body>
</html>
