<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZapaStore | Iniciar Sesión</title>

    <!-- Bootstrap y estilos base -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

    <!-- CSS personalizado -->
    <link rel="stylesheet" th:href="@{/css/style.css}">

    <style>
        body {
          font-family: 'Roboto', sans-serif;
          background: linear-gradient(135deg, #f8f9fa, #e9ecef);
        }

        .login-card {
          background: #ffffff;
          border-radius: 15px;
          padding: 40px;
          box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
          transition: transform 0.3s ease;
        }

        .login-card:hover {
          transform: translateY(-5px);
        }

        h1 {
          font-weight: 700;
          color: #212529;
        }

        label {
          font-weight: 500;
          color: #495057;
          margin-top: 15px;
        }

        input[type="email"],
        input[type="password"] {
          border-radius: 8px;
          border: 1px solid #ced4da;
          padding: 10px;
          transition: border-color 0.2s ease;
        }

        input:focus {
          border-color: #0d6efd;
          box-shadow: 0 0 0 0.2rem rgba(13,110,253,.25);
          outline: none;
        }

        button[type="submit"] {
          margin-top: 25px;
          background: #0d6efd;
          border: none;
          border-radius: 10px;
          color: #fff;
          font-weight: 600;
          padding: 12px;
          width: 100%;
          transition: background 0.3s ease;
        }

        button[type="submit"]:hover {
          background: #0b5ed7;
        }

        .alert {
          font-size: 0.9rem;
          border-radius: 8px;
        }

        .register-btn {
          border-radius: 10px;
          font-weight: 500;
          padding: 10px;
        }

        footer {
          text-align: center;
          color: #6c757d;
          font-size: 0.9rem;
          padding: 20px 0;
        }

        .fade-in {
          animation: fadeIn 0.6s ease-in-out;
        }

        @keyframes fadeIn {
          from { opacity: 0; transform: translateY(10px); }
          to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

<body class="d-flex flex-column min-vh-100 bg-light">

<div th:replace="~{layout :: header}"></div>

<main class="container my-5 flex-grow-1 fade-in">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-4">
            <div class="login-card">
                <h1 class="text-center mb-3">Iniciar Sesión</h1>
                <p class="text-center text-muted mb-4">Accede a tu cuenta de <strong>ZapaStore</strong>.</p>

                <!-- 🔹 Mensaje de error -->
                <div th:if="${error}" class="alert alert-danger text-center" role="alert">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i>
                    <span th:text="${error}"></span>
                </div>

                <!-- 🔹 Formulario -->
                <form th:action="@{/login}" th:object="${usuario}" method="post">
                    <div class="mb-3">
                        <label for="correo">Correo Electrónico</label>
                        <input id="correo" type="email" class="form-control" th:field="*{correo}" required>
                    </div>

                    <div class="mb-3">
                        <label for="contrasena">Contraseña</label>
                        <input id="contrasena" type="password" class="form-control" th:field="*{contrasena}" required>
                    </div>

                    <button type="submit" class="btn btn-primary">Iniciar Sesión</button>
                </form>

                <hr class="my-4">

                <div class="text-center">
                    <p class="mb-2">¿Aún no tienes cuenta?</p>
                    <a th:href="@{/registro}" class="btn btn-outline-secondary register-btn w-100">
                        <i class="bi bi-person-plus-fill me-1"></i> Crear una Cuenta
                    </a>
                </div>
            </div>
        </div>
    </div>
</main>

<footer>
    &copy; 2025 ZapaStore — Todos los derechos reservados.
</footer>

<div th:replace="~{layout :: scripts}"></div>
</body>
</html>
