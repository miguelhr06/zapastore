<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZapaStore | Registro</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        body {
          font-family: 'Roboto', sans-serif;
          background: linear-gradient(135deg, #f8f9fa, #e9ecef);
          display: flex;
          justify-content: center;
          align-items: center;
          min-height: 100vh;
          padding: 20px;
        }

        .registro-card {
          background: #fff;
          border-radius: 15px;
          box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
          padding: 40px;
          max-width: 450px;
          width: 100%;
          transition: transform 0.3s ease;
        }

        .registro-card:hover {
          transform: translateY(-5px);
        }

        h2 {
          text-align: center;
          font-weight: 700;
          color: #212529;
          margin-bottom: 25px;
        }

        label {
          font-weight: 500;
          margin-top: 12px;
          color: #495057;
        }

        input {
          border-radius: 8px;
          border: 1px solid #ced4da;
          padding: 10px;
          width: 100%;
          margin-top: 5px;
          transition: all 0.2s ease;
        }

        input:focus {
          border-color: #0d6efd;
          box-shadow: 0 0 0 0.2rem rgba(13,110,253,.25);
          outline: none;
        }

        button {
          margin-top: 25px;
          width: 100%;
          background-color: #0d6efd;
          border: none;
          color: #fff;
          font-weight: 600;
          border-radius: 10px;
          padding: 12px;
          transition: background 0.3s ease;
        }

        button:hover {
          background-color: #0b5ed7;
        }

        .error {
          color: #dc3545;
          text-align: center;
          margin-top: 15px;
          font-weight: 500;
        }

        .back-login {
          display: block;
          text-align: center;
          margin-top: 20px;
          color: #6c757d;
          font-size: 0.9rem;
          text-decoration: none;
          transition: color 0.2s ease;
        }

        .back-login:hover {
          color: #0d6efd;
        }

        .fade-in {
          animation: fadeIn 0.6s ease-in-out;
        }

        @keyframes fadeIn {
          from { opacity: 0; transform: translateY(10px); }
          to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

<body>
<div class="registro-card fade-in">
    <h2>Registro de Usuario</h2>

    <form th:action="@{/registro}" th:object="${usuario}" method="post">
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" th:field="*{nombre}" placeholder="Tu nombre" required>

        <label for="apellido">Apellido:</label>
        <input type="text" id="apellido" th:field="*{apellido}" placeholder="Tu apellido" required>

        <label for="correo">Correo:</label>
        <input type="email" id="correo" th:field="*{correo}" placeholder="ejemplo@correo.com" required>

        <label for="telefono">Teléfono:</label>
        <input type="tel" id="telefono" th:field="*{telefono}" placeholder="Tu número de teléfono" required>

        <label for="direccion">Dirección:</label>
        <input type="text" id="direccion" th:field="*{direccion}" placeholder="Tu dirección" required>

        <label for="contrasena">Contraseña:</label>
        <input type="password" id="contrasena" th:field="*{contrasena}" placeholder="Crea una contraseña" required>

        <button type="submit">
            <i class="bi bi-person-plus-fill me-2"></i>Registrar
        </button>

        <div th:if="${param.error}" class="error">
            ⚠️ Este correo ya está registrado o hubo un error.
        </div>
    </form>

    <a th:href="@{/login}" class="back-login">
        <i class="bi bi-arrow-left-circle me-1"></i> Volver al inicio de sesión
    </a>
</div>
</body>
</html>
