<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Mi Perfil - ZapaStore</title>

    <!-- Bootstrap + Icons + Fuente -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #f8f9fa, #eef1f5);
            color: #333;
        }

        /* Navbar */
        .navbar {
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            font-weight: 500;
        }

        .navbar-brand {
            font-weight: 700;
            font-size: 1.4rem;
        }

        /* Tarjetas */
        .card {
            border-radius: 15px;
            border: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            background-color: #fff;
        }

        h2, h4 {
            font-weight: 700;
        }

        table {
            background: #fff;
        }

        /* Animación */
        .fade-in {
            animation: fadeIn 0.6s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

<body>

<!-- 🔹 NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
    <div class="container">
        <a class="navbar-brand" href="/">👟 ZapaStore</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="/">Inicio</a></li>
                <li class="nav-item"><a class="nav-link" href="/productos">Productos</a></li>
                <li class="nav-item"><a class="nav-link" href="/contacto">Contacto</a></li>
                <li class="nav-item"><a class="nav-link active" href="/perfil">Mi Perfil</a></li>
            </ul>

            <a href="/logout" class="btn btn-outline-light">
                <i class="bi bi-box-arrow-right"></i> Cerrar Sesión
            </a>
        </div>
    </div>
</nav>

<!-- 🔹 CONTENIDO PERFIL -->
<div class="card p-4 mt-4">
    <h4>🧾 Mis Compras</h4>

    <div th:if="${ventas.size() == 0}" class="alert alert-info mt-3">
        Aún no tienes compras registradas.
    </div>

    <div th:each="v : ${ventas}" class="mt-4 fade-in">

        <h5 class="fw-bold">Compra del <span th:text="${v.fecha}"></span></h5>
        <p><strong>Método de Pago:</strong> <span th:text="${v.metodoPago}"></span></p>
        <p><strong>Total:</strong> S/. <span th:text="${v.total}"></span></p>

        <!-- BOTÓN PDF -->
        <a th:href="@{'/venta/' + ${v.id} + '/pdf'}" class="btn btn-primary mb-3">
            <i class="bi bi-file-earmark-pdf-fill"></i> Descargar PDF
        </a>

        <!-- TABLA DE DETALLES -->
        <table class="table table-bordered mt-3">
            <thead class="table-dark">
            <tr>
                <th>Producto</th>
                <th>Cantidad</th>
                <th>Precio Unit.</th>
                <th>Subtotal</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="d : ${v.detalles}">
                <td th:text="${d.nombreProducto}"></td>
                <td th:text="${d.cantidad}"></td>
                <td>S/. <span th:text="${d.precioUnitario}"></span></td>
                <td>S/. <span th:text="${d.subtotal}"></span></td>
            </tr>
            </tbody>
        </table>

        <hr class="my-4">
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
